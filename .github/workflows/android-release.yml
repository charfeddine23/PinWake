name: Android Release CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify signing secrets & decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" || -z "${STORE_PASSWORD}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::error::Missing required GitHub Secrets: KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD must be configured in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          chmod 600 "${{ github.workspace }}/my-upload-key.jks"

      - name: Extract & auto-increment version without duplicate tags
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force

          # Extract base versionName from app/build.gradle.kts (fallback 1.0.0)
          BASE_VERSION=$(sed -n 's/.*versionName *=.*"\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/p' app/build.gradle.kts | head -n 1)
          BASE_VERSION="${BASE_VERSION:-1.0.0}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_VERSION}"
          CANDIDATE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          CANDIDATE_TAG="v${CANDIDATE_VERSION}"

          # Collect existing git tags & GitHub releases to prevent duplicate tags
          EXISTING_TAGS=$(printf "%s\n%s\n" \
            "$(git tag -l)" \
            "$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName' || true)")

          # Compute highest versionCode so direct in-place updates always succeed
          HIGHEST_SEQ=$((MINOR * 10 + PATCH))
          while IFS= read -r existing; do
            if [[ "$existing" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              E_MAJ="${BASH_REMATCH[1]}"
              E_MIN="${BASH_REMATCH[2]}"
              E_PAT="${BASH_REMATCH[3]}"
              if (( E_MAJ == MAJOR )); then
                E_SEQ=$((E_MIN * 10 + E_PAT))
                if (( E_SEQ >= HIGHEST_SEQ )); then
                  HIGHEST_SEQ=$((E_SEQ + 1))
                fi
              fi
            fi
          done <<< "${EXISTING_TAGS}"

          # If candidate tag already exists (or run_number advanced past it), bump to next free tag
          if echo "${EXISTING_TAGS}" | grep -qx "${CANDIDATE_TAG}"; then
            NEXT_SEQ=$((HIGHEST_SEQ))
            MINOR=$((NEXT_SEQ / 10))
            PATCH=$((NEXT_SEQ % 10))
            CANDIDATE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            CANDIDATE_TAG="v${CANDIDATE_VERSION}"
            while echo "${EXISTING_TAGS}" | grep -qx "${CANDIDATE_TAG}"; do
              NEXT_SEQ=$((NEXT_SEQ + 1))
              MINOR=$((NEXT_SEQ / 10))
              PATCH=$((NEXT_SEQ % 10))
              CANDIDATE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
              CANDIDATE_TAG="v${CANDIDATE_VERSION}"
            done
          fi

          RUN_CODE=$((${{ github.run_number }} + 1))
          SEQ_CODE=$((MINOR * 10 + PATCH + 1))
          VERSION_CODE=$(( RUN_CODE > SEQ_CODE ? RUN_CODE : SEQ_CODE ))

          # Extract app_name and sanitize spaces for clean release asset name (PinWake-v1.0.x.apk)
          RAW_APP_NAME=$(sed -n 's/.*<string name="app_name">\([^<]*\)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -n 1)
          SAFE_APP_NAME=$(echo "${RAW_APP_NAME:-PinWake}" | tr -d '[:space:]')
          APK_FILENAME="${SAFE_APP_NAME}-v${CANDIDATE_VERSION}.apk"

          echo "version_name=${CANDIDATE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${CANDIDATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_filename=${APK_FILENAME}" >> "$GITHUB_OUTPUT"

          echo "Resolved release version: ${CANDIDATE_VERSION} (versionCode=${VERSION_CODE}, tag=${CANDIDATE_TAG}, file=${APK_FILENAME})"

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build signed Release APK
        id: build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          ./gradlew assembleRelease --no-daemon

          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "${SOURCE_APK}" ]]; then
            echo "::error::Release APK not found at ${SOURCE_APK}"
            exit 1
          fi

          mkdir -p "${{ github.workspace }}/release-artifacts"
          RENAMED_APK="${{ github.workspace }}/release-artifacts/${{ steps.version.outputs.apk_filename }}"
          cp "${SOURCE_APK}" "${RENAMED_APK}"
          echo "apk_path=${RENAMED_APK}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & upload APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Pin Wake ${{ steps.version.outputs.tag_name }}
          body: |
            Automated signed Release APK for **Pin Wake** (`${{ steps.version.outputs.version_name }}`, `versionCode ${{ steps.version.outputs.version_code }}`).
            Commit: `${{ github.sha }}`
          files: ${{ steps.build.outputs.apk_path }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
