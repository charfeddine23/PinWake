name: Release Signed Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "${SDK_ROOT}/licenses"

          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}/cmdline-tools/bin/sdkmanager" \
            "${SDK_ROOT}/tools/bin/sdkmanager"; do
            if [[ -x "${candidate}" ]]; then
              SDKMANAGER="${candidate}"
              break
            fi
          done

          if [[ -z "${SDKMANAGER}" ]]; then
            CMDLINE_ZIP="/tmp/cmdline-tools.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "${CMDLINE_ZIP}"
            mkdir -p "${SDK_ROOT}/cmdline-tools"
            unzip -q -o "${CMDLINE_ZIP}" -d "${SDK_ROOT}/cmdline-tools"
            mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
            rm -f "${CMDLINE_ZIP}"
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          set -o pipefail

          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify signing secrets & decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [[ -z "${KEYSTORE_BASE64}" ]] && missing+=("KEYSTORE_BASE64")
          [[ -z "${KEYSTORE_PASSWORD}" ]] && missing+=("KEYSTORE_PASSWORD")
          [[ -z "${KEY_ALIAS}" ]] && missing+=("KEY_ALIAS")
          [[ -z "${KEY_PASSWORD}" ]] && missing+=("KEY_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            exit 1
          fi

          echo "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${{ github.workspace }}/app/release-keystore.jks"
          chmod 600 "${{ github.workspace }}/app/release-keystore.jks"

      - name: Extract & auto-increment version without duplicate tags
        id: version
        run: |
          git fetch --tags --force

          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1 || true)

          if [[ -z "${LATEST_TAG}" ]]; then
            BASE_VERSION=$(sed -n 's/.*versionName *=.*"\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/p' app/build.gradle.kts | head -n 1)
            VERSION_NAME="${BASE_VERSION:-1.0.0}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
          else
            CLEAN_LATEST="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN_LATEST}"
            PATCH=$((PATCH + 1))
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG_NAME="v${VERSION_NAME}"
          while git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
            TAG_NAME="v${VERSION_NAME}"
          done

          SEMVER_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH + 1))
          RUN_CODE=$((${{ github.run_number }} + 1))
          VERSION_CODE=$(( SEMVER_CODE > RUN_CODE ? SEMVER_CODE : RUN_CODE ))

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved release: ${TAG_NAME} (versionName=${VERSION_NAME}, versionCode=${VERSION_CODE})"

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Create GitHub Release & upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"

          SIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [[ -z "${SIGNED_APK}" || ! -f "${SIGNED_APK}" ]]; then
            echo "::error::Signed Release APK not found under app/build/outputs/apk/release/"
            exit 1
          fi

          RAW_APP_NAME=$(sed -n 's/.*<string name="app_name">\([^<]*\)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -n 1)
          SAFE_APP_NAME=$(echo "${RAW_APP_NAME:-PinWake}" | tr -d '[:space:]')
          RENAMED_APK="app/build/outputs/apk/release/${SAFE_APP_NAME}-v${VERSION_NAME}.apk"
          cp "${SIGNED_APK}" "${RENAMED_APK}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

          gh release create "${TAG_NAME}" "${RENAMED_APK}" \
            --repo "${{ github.repository }}" \
            --title "Pin Wake ${TAG_NAME}" \
            --notes "Signed Release APK for **Pin Wake** (\`v${VERSION_NAME}\`, \`versionCode ${VERSION_CODE}\`). Built from commit \`${GITHUB_SHA}\`." \
            --latest
